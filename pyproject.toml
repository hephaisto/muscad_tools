[build-system]
requires = ["pdm-backend >= 2.4.0"]
build-backend = "pdm.backend"

[project]
name = "muscad_tools"
description = "Commonly used 3D components usable for muscad (screws, profiles, ...)"
dynamic= ["version"]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["openscad", "stl"]
authors = [
  { name = "hephaisto" },
]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "muscad",
]

[project.urls]
source = "https://github.com/hephaisto/muscad_tools"

[tool.pdm.version]
source = "scm"

