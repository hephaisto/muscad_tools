[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "muscad_tools"
version = "0.0.1"
description = "Commonly used 3D components usable for muscad (screws, profiles, ...)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["openscad", "stl"]
authors = [
  { name = "hephaisto" },
]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "muscad",
]

[project.urls]
source = "https://github.com/hephaisto/muscad_tools"


